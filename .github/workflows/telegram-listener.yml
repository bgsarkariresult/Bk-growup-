name: Telegram Link Listener

# Har 5 minute me chalega aur check karega ki Telegram bot par koi naya link aaya hai ya nahi
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  listen:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: requests install karo
        run: pip install requests

      - name: Telegram check karo aur job trigger karo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python telegram_listener.py

      - name: Offset file save karo (taki purana link dobara na chale)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram_offset.txt
          git diff --staged --quiet || git commit -m "chore: update telegram offset [skip ci]"
          git push
